name: Agnes performance patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v94.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Agnes polling
        shell: python
        run: |
          from pathlib import Path

          server = Path('cinema_v9/server.js')
          text = server.read_text(encoding='utf-8')

          marker = "  const basePollDelay =\n    2000;"
          replacement = "  const basePollDelay =\n    2000;\n\n  const nearCompletionPollDelay =\n    1000;"

          if 'const nearCompletionPollDelay' not in text:
              if marker not in text:
                  raise SystemExit('poll delay marker not found in current server.js')
              text = text.replace(marker, replacement, 1)

          marker2 = "  function getAdaptivePollDelay(progress) {\n    if (progress == null) {\n      return basePollDelay;\n    }"
          replacement2 = "  function getAdaptivePollDelay(progress) {\n    if (progress == null) {\n      return basePollDelay;\n    }\n\n    if (Number(progress) >= 90) {\n      return nearCompletionPollDelay;\n    }"

          if 'return nearCompletionPollDelay;' not in text:
              if marker2 not in text:
                  raise SystemExit('adaptive polling marker not found in current server.js')
              text = text.replace(marker2, replacement2, 1)

          server.write_text(text, encoding='utf-8')

      - name: Verify
        run: |
          grep -n "nearCompletionPollDelay" cinema_v9/server.js
          grep -n "agnes-video-v2.0" cinema_v9/server.js

      - name: Commit server patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cinema_v9/server.js
          if git diff --cached --quiet; then
            echo "No server changes needed."
          else
            git commit -m "perf: reduce Agnes completion polling latency"
            git push
          fi

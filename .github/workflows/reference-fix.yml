name: One-time server reference fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[reference-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server reference handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cinema_v9/server.js')
          s=p.read_text()
          old="""          const sceneInput = {\n            ...scene,\n            images: scene.images?.length ? scene.images : (job.referenceImage ? [job.referenceImage] : [])\n          };"""
          new="""          // Preserve each scene's own reference image(s).\n          // Use the shared master reference only when this scene has no image of its own.\n          const sceneInput = {\n            ...scene,\n            images: scene.images?.length\n              ? scene.images\n              : (job.referenceImage ? [job.referenceImage] : [])\n          };"""
          if old not in s:
              raise SystemExit('worker snippet not found')
          s=s.replace(old,new,1)
          old2="""              images:\n                hasSharedLegacyReference || suppliedReference\n                  ? []\n                  : images,"""
          new2="""              // Keep scene-specific references intact.\n              // A shared reference is only a fallback for scenes without their own image.\n              images: images,"""
          if old2 not in s:
              raise SystemExit('storage snippet not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cinema_v9/server.js
          git diff --cached --quiet && exit 0
          git commit -m '[reference-fix] preserve scene-specific references'
          git push

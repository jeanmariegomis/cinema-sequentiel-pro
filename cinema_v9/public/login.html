<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion — Cinéma Séquentiel Pro</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#09090f;
  color:#fff
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at top,#201536 0,#09090f 55%)
}
.card{
  width:min(430px,94vw);
  background:#17171f;
  border:1px solid #343445;
  border-radius:22px;
  padding:26px;
  box-shadow:0 22px 70px rgba(0,0,0,.55)
}
.logo{font-size:38px;margin-bottom:8px}
.title{font-size:25px;font-weight:800;margin-bottom:7px}
.sub{color:#a9a9b8;line-height:1.45;margin-bottom:22px}
.label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #3a3a4d;
  background:#0f0f16;
  color:#fff;
  font-size:16px;
  outline:none
}
input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 3px rgba(139,92,246,.15)
}
button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:0;
  border-radius:11px;
  background:linear-gradient(120deg,#8b5cf6,#6d4de6);
  color:#fff;
  font-weight:800;
  font-size:16px;
  cursor:pointer
}
button:disabled{opacity:.6}
.error{
  min-height:22px;
  margin-top:12px;
  color:#ff7777;
  font-size:14px
}
.note{
  margin-top:18px;
  color:#77778a;
  font-size:12px;
  text-align:center
}

/* ===== CONSOLE AUTH ===== */
.debug{
  margin-top:20px;
  border:1px solid #343445;
  border-radius:14px;
  overflow:hidden;
  background:#0b0b11
}
.debug-head{
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#13131c;
  border-bottom:1px solid #343445;
  font-size:13px;
  font-weight:800
}
.debug-status{
  font-size:11px;
  color:#a9a9b8
}
.console{
  height:190px;
  overflow-y:auto;
  padding:10px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:11px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word
}
.log{
  margin-bottom:5px
}
.log-info{color:#d7d7e5}
.log-ok{color:#7ee787}
.log-warn{color:#f2cc60}
.log-error{color:#ff7b72}
.clear{
  width:auto;
  margin:0;
  padding:5px 8px;
  font-size:10px;
  background:#252535
}
</style>
</head>

<body>

<main class="card">

  <div class="logo">🔐</div>

  <div class="title">Connexion privée</div>

  <div class="sub">
    Connectez-vous pour accéder à
    <strong>Cinéma Séquentiel Pro</strong>.
  </div>

  <form id="login-form" action="/api/auth/login" method="post">

    <label class="label" for="password">
      Mot de passe
    </label>

    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      placeholder="Votre mot de passe"
      required
      autofocus
    >

    <button id="login" type="submit">
      🔓 Se connecter
    </button>

    <div id="error" class="error"></div>

  </form>

  <div class="note">
    Accès protégé par le serveur Render
  </div>

  <!-- CONSOLE AUTH -->
  <div style="background:red;color:white;padding:20px;margin-top:20px;font-size:20px;font-weight:bold;">
TEST VERSION DEBUG 123
  </div>
  <section class="debug" style="display:block!important;visibility:visible!important;position:relative!important;background:#050505!important;color:#00ff88!important;padding:20px!important;margin-top:20px!important;border:2px solid #00ff88!important;border-radius:12px!important;">

    <div class="debug-head">
      <span>🛠️ Console Auth</span>

      <span>
        <span id="debug-status" class="debug-status">
          Initialisation...
        </span>

        <button
          id="clear-console"
          class="clear"
          type="button"
        >
          Effacer
        </button>
      </span>
    </div>

    <div id="console" class="console" style="display:block!important;min-height:120px!important;background:#000!important;color:#00ff88!important;padding:12px!important;font-family:monospace!important;">
CONSOLE AUTH — TEST OK
</div>
  </section>

</main>

<script>
(() => {

  const form = document.getElementById('login-form');
  const input = document.getElementById('password');
  const button = document.getElementById('login');
  const error = document.getElementById('error');

  const consoleBox = document.getElementById('console');
  const debugStatus = document.getElementById('debug-status');
  const clearButton = document.getElementById('clear-console');

  function now() {
    return new Date().toLocaleTimeString();
  }

  function log(message, type = 'info') {

    const line = document.createElement('div');

    line.className = `log log-${type}`;

    line.textContent = `[${now()}] ${message}`;

    consoleBox.appendChild(line);

    consoleBox.scrollTop = consoleBox.scrollHeight;

    console.log('[AUTH]', message);
  }

  function status(message) {
    debugStatus.textContent = message;
  }

  clearButton.addEventListener('click', () => {
    consoleBox.innerHTML = '';
    log('Console effacée');
  });

  log('Page de connexion chargée');

  /*
   * Vérification de la session actuelle
   */
  async function checkAuthStatus() {

    log('Vérification de /api/auth/status...');

    try {

      const response = await fetch('/api/auth/status', {
        method: 'GET',
        credentials: 'same-origin',
        cache: 'no-store'
      });

      log(`/api/auth/status → HTTP ${response.status}`);

      const text = await response.text();

      log(`Réponse reçue (${text.length} caractères)`);

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        log('La réponse du serveur n’est pas du JSON', 'warn');
        status('Réponse invalide');
        return;
      }

      log(
        `authenticated = ${Boolean(data.authenticated)}`,
        data.authenticated ? 'ok' : 'info'
      );

      if (data.authConfigured !== undefined) {

        log(
          `authConfigured = ${Boolean(data.authConfigured)}`,
          data.authConfigured ? 'ok' : 'warn'
        );

      }

      if (data.authenticated) {

        status('Déjà connecté');

        log(
          'Session valide → redirection vers l’application',
          'ok'
        );

        location.replace('/');

        return;
      }

      status('Non connecté');

      log('Aucune session valide');

    } catch (err) {

      status('Erreur réseau');

      log(
        `Erreur status : ${err.message}`,
        'error'
      );

    }
  }

  /*
   * Connexion
   */
  form.addEventListener('submit', async (event) => {

    event.preventDefault();

    error.textContent = '';

    const password = input.value;

    if (!password) {

      log(
        'Aucun mot de passe saisi',
        'warn'
      );

      return;
    }

    button.disabled = true;
    button.textContent = 'Connexion...';

    status('Connexion en cours');

    log('Tentative de connexion...');
    log('Mot de passe reçu côté navigateur : OUI');
    log('Valeur du mot de passe : MASQUÉE');

    try {

      const response = await fetch(
        '/api/auth/login',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json',
            'Accept':
              'application/json'
          },

          credentials: 'same-origin',

          body: JSON.stringify({
            password
          })
        }
      );

      log(
        `POST /api/auth/login → HTTP ${response.status}`,
        response.ok ? 'ok' : 'error'
      );

      const text = await response.text();

      log(
        `Réponse login reçue (${text.length} caractères)`
      );

      let data = {};

      try {
        data = text ? JSON.parse(text) : {};
      } catch {

        log(
          'Réponse login non JSON',
          'warn'
        );

      }

      if (!response.ok) {

        const serverError =
          data.error ||
          `HTTP ${response.status}`;

        log(
          `Authentification refusée : ${serverError}`,
          'error'
        );

        if (serverError === 'INVALID_PASSWORD') {
          error.textContent =
            'Mot de passe incorrect.';
        }
        else if (
          serverError === 'AUTH_NOT_CONFIGURED'
        ) {
          error.textContent =
            'Authentification non configurée sur Render.';
        }
        else {
          error.textContent =
            `Erreur : ${serverError}`;
        }

        status('Échec');

        return;
      }

      log(
        'Réponse de connexion positive',
        'ok'
      );

      status('Connexion acceptée');

      /*
       * Vérification immédiate de la session.
       */
      log(
        'Vérification du cookie/session...'
      );

      const statusResponse =
        await fetch(
          '/api/auth/status',
          {
            method: 'GET',
            credentials: 'same-origin',
            cache: 'no-store'
          }
        );

      log(
        `/api/auth/status après login → HTTP ${statusResponse.status}`
      );

      const statusText =
        await statusResponse.text();

      let statusData = {};

      try {
        statusData =
          statusText
            ? JSON.parse(statusText)
            : {};
      } catch {}

      log(
        `Session après login : authenticated = ${Boolean(statusData.authenticated)}`,
        statusData.authenticated
          ? 'ok'
          : 'error'
      );

      if (statusData.authenticated) {

        status('Connecté');

        log(
          'SESSION VALIDÉE → ouverture de l’application',
          'ok'
        );

        location.replace('/');

        return;
      }

      /*
       * Ici se trouve précisément le problème
       * si le serveur accepte le login mais
       * que le cookie n'est pas conservé.
       */
      status('Session non reconnue');

      error.textContent =
        'Connexion acceptée mais session non reconnue.';

      log(
        '⚠️ Le serveur a accepté la connexion mais /api/auth/status ne reconnaît pas la session.',
        'error'
      );

    } catch (err) {

      status('Erreur réseau');

      log(
        `Erreur pendant la connexion : ${err.message}`,
        'error'
      );

      error.textContent =
        'Impossible de contacter le serveur.';

    }
    finally {

      button.disabled = false;
      button.textContent =
        '🔓 Se connecter';

    }

  });

  /*
   * Affichage des erreurs déjà présentes
   * dans l'URL.
   */
  const params =
    new URLSearchParams(
      location.search
    );

  const code =
    params.get('error');

  if (code === 'AUTH_NOT_CONFIGURED') {

    error.textContent =
      'Authentification non configurée sur Render.';

    log(
      'Erreur reçue : AUTH_NOT_CONFIGURED',
      'error'
    );

  }
  else if (code === 'INVALID_PASSWORD') {

    error.textContent =
      'Mot de passe incorrect.';

    log(
      'Erreur reçue : INVALID_PASSWORD',
      'error'
    );

  }

  checkAuthStatus();

})();
</script>

</body>
</html>

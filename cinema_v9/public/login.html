<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="Pragma" content="no-cache">
<meta name="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion — Cinéma Séquentiel Pro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#09090f;color:#fff}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at top,#201536 0,#09090f 55%)}.card{width:min(430px,94vw);background:#17171f;border:1px solid #343445;border-radius:22px;padding:26px;box-shadow:0 22px 70px rgba(0,0,0,.55)}.logo{font-size:38px;margin-bottom:8px}.title{font-size:25px;font-weight:800;margin-bottom:7px}.sub{color:#a9a9b8;line-height:1.45;margin-bottom:22px}.label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;padding:14px;border-radius:11px;border:1px solid #3a3a4d;background:#0f0f16;color:#fff;font-size:16px;outline:none}input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.15)}button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:11px;background:linear-gradient(120deg,#8b5cf6,#6d4de6);color:#fff;font-weight:800;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.error{min-height:22px;margin-top:12px;color:#ff7777;font-size:14px}.note{margin-top:18px;color:#77778a;font-size:12px;text-align:center}.debug{margin-top:20px;border:1px solid #343445;border-radius:14px;overflow:hidden;background:#0b0b11}.debug-head{padding:10px 12px;background:#13131c;border-bottom:1px solid #343445;font-size:13px;font-weight:800}.console{height:130px;overflow-y:auto;padding:10px;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.log{margin-bottom:5px}.ok{color:#7ee787}.warn{color:#f2cc60}.err{color:#ff7b72}.info{color:#d7d7e5}
</style>
</head>
<body>
<main class="card">
<div class="logo">🔐</div>
<div class="title">Connexion privée</div>
<div class="sub">Connectez-vous pour accéder à <strong>Cinéma Séquentiel Pro</strong>.</div>
<form id="login-form" action="/api/auth/login" method="post">
<label class="label" for="password">Mot de passe</label>
<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required autofocus>
<button id="login" type="submit">🔓 Se connecter</button>
<div id="error" class="error"></div>
</form>
<div class="note">Accès protégé par le serveur Render</div>
<div class="debug"><div class="debug-head">Journal de connexion</div><div id="console" class="console"></div></div>
</main>
<script>
(()=>{
 const form=document.getElementById('login-form'),input=document.getElementById('password'),button=document.getElementById('login'),error=document.getElementById('error'),box=document.getElementById('console');
 function log(m,t='info'){const d=document.createElement('div');d.className='log '+t;d.textContent='['+new Date().toLocaleTimeString()+'] '+m;box.appendChild(d);box.scrollTop=box.scrollHeight;console.log('[AUTH]',m)}
 log('Page de connexion chargée');
 const params=new URLSearchParams(location.search); if(params.get('error')==='INVALID_PASSWORD') error.textContent='Mot de passe incorrect.'; if(params.get('error')==='AUTH_NOT_CONFIGURED') error.textContent='Authentification non configurée sur Render.';
 form.addEventListener('submit',e=>{
   e.preventDefault(); error.textContent=''; button.disabled=true; button.textContent='Connexion...'; log('Envoi de la connexion au serveur...','info');
   // Native form submission is intentionally used here: the browser processes Set-Cookie
   // and the server performs the authenticated 303 redirect to /. This avoids a second
   // client-side status request racing the cookie update on mobile browsers.
   const nativeForm=document.createElement('form'); nativeForm.method='POST'; nativeForm.action='/api/auth/login'; nativeForm.style.display='none';
   const p=document.createElement('input'); p.type='password'; p.name='password'; p.value=input.value; nativeForm.appendChild(p); document.body.appendChild(nativeForm); nativeForm.submit();
 });
})();
</script>
</body>
</html>
